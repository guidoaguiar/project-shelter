<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>SHELTER // Field Node</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/shelter.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/command" aria-label="Shelter command">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3 2 20h4.6L12 10.6 17.4 20H22L12 3Z" fill="currentColor"/><path d="M12 14.5 8.8 20h6.4L12 14.5Z" class="a"/></svg>
        <span class="brand-name">SHELTER</span>
        <span class="brand-sub" id="callsign">FIELD NODE</span>
      </a>
      <div class="telemetry">
        <div class="tele"><span class="k">ZULU</span><span class="v" id="clock-z">--:--:--Z</span></div>
        <div class="tele opt"><span class="k">LOCAL</span><span class="v" id="clock-l">--:--:--</span></div>
        <div class="tele opt"><span class="k">GRID</span><span class="v" id="grid">NOT SET</span></div>
        <span class="tag guest" id="guest" hidden title="This device has not entered the PIN: household data is hidden">GUEST</span>
        <div class="tele leds">
          <span class="led" id="led-net" title="Uplink"><i></i>NET</span>
          <span class="led" id="led-ai" title="Model link"><i></i>AI</span>
          <span class="led" id="led-dkr" title="Docker"><i></i>DKR</span>
        </div>
      </div>
      <a class="btn firstaid" id="firstaid" href="#/manual/first-aid" title="First aid cards">FIRST AID</a>
      <button class="btn ghost" id="theme" title="Cycle display mode: dark, night vision, daylight">DARK</button>
    </header>
    <nav class="rail" id="rail" aria-label="Modules"></nav>
    <main id="view" tabindex="-1"></main>
    <footer class="statusline">
      <span id="status-left">INITIALISING</span>
      <span id="status-right"></span>
    </footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="print" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
